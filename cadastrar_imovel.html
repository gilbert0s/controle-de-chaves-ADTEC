<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastrar Imóvel - ADTEC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="icon" href="img/logoADTEC.png" type="image/png">
</head>
<body class="dashboard-body">

  <div id="navbar-container"></div>

  <main class="container-fluid mt-4">
    <div class="dashboard-container">
      <h1 class="dashboard-title">Cadastrar Novo Imóvel</h1>
      
      <form class="row g-3" id="form-cadastro-imovel">
        <div class="col-md-6">
          <label for="input-endereco" class="form-label">Endereço</label>
          <input type="text" class="form-control" id="input-endereco" placeholder="Rua das Flores, 123">
        </div>
        <div class="col-md-6">
          <label for="input-bairro" class="form-label">Bairro</label>
          <input type="text" class="form-control" id="input-bairro" placeholder="Centro">
        </div>
        <div class="col-md-4">
          <label for="input-codigo" class="form-label">Código / Referência</label>
          <input type="text" class="form-control" id="input-codigo" placeholder="101">
        </div>
        <div class="col-md-4">
          <label for="input-tipo" class="form-label">Tipo de Imóvel</label>
          <select id="input-tipo" class="form-select">
            <option selected>Escolher...</option>
            <option>Apartamento</option>
            <option>Casa</option>
            <option>Comercial</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="input-chaves" class="form-label">Nº de Cópias da Chave</label>
          <input type="number" class="form-control" id="input-chaves" value="1">
        </div>
        <div class="col-12">
          <label for="input-observacoes" class="form-label">Observações</label>
          <textarea class="form-control" id="input-observacoes" rows="3"></textarea>
        </div>
        <div class="col-12 mt-4">
          <button type="submit" class="btn btn-primary">Salvar Imóvel</button>
          <a href="dashboard.html" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
