<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - ADTEC</title>
    
    <link rel="stylesheet" href="dashboard.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 id="welcome-message">Bem-vindo(a)!</h1>
        <p>Este é o seu painel de controle. Em breve, aqui estarão as funcionalidades:</p>
        <ul>
            <li>Controle de retirada e devolução de chaves</li>
            <li>Cadastro de novos imóveis</li>
            <li>Relatórios e buscas</li>
        </ul>
        <a href="index.html" class="logout">Sair</a>
    </div>

    <script>
        const usuarioLogado = localStorage.getItem('usuarioLogado');
        if (usuarioLogado) {
            document.getElementById('welcome-message').textContent = `Bem-vindo(a), ${usuarioLogado}!`;
        }
    </script>
</body>
</html>
