<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relatórios - ADTEC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="icon" href="img/logoADTEC.png" type="image/png">

  <style>
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        margin-top: 0;
      }
    }
  </style>
</head>
<body class="dashboard-body">

  <div id="navbar-container" class="no-print"></div>

  <main class="container-fluid mt-4">
    <div class="dashboard-container">
      <h1 class="dashboard-title">Histórico de Movimentação</h1>

      <!-- Filtros -->
      <div class="row g-3 align-items-center mb-4 no-print">
        <div class="col-md-6">
          <input type="text" class="form-control" id="input-busca-historico" placeholder="Filtrar por imóvel, código ou responsável...">
        </div>
        <div class="col-md-6 text-md-end">
          <button class="btn btn-primary" id="btnImprimir">Imprimir Relatório</button>
        </div>
      </div>

      <!-- Tabela -->
      <div class="table-responsive">
        <table class="table table-striped table-bordered">
          <thead class="table-light">
            <tr>
              <th>Data</th>
              <th>Imóvel</th>
              <th>Ação</th>
              <th>Responsável</th>
            </tr>
          </thead>
          <tbody id="tabela-historico-corpo">
            <!-- JS vai preencher -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Carregar navbar
      fetch("navbar.html")
        .then(res => res.text())
        .then(html => document.getElementById("navbar-container").innerHTML = html);

      const corpoTabela = document.getElementById("tabela-historico-corpo");
      const inputFiltro = document.getElementById("input-busca-historico");
      const btnImprimir = document.getElementById("btnImprimir");

      function carregarHistorico(filtro = "") {
        const historico = JSON.parse(localStorage.getItem("historicoChaves")) || [];
        const termo = filtro.toLowerCase().trim();

        const filtrado = historico.filter(item =>
          item.imovelEndereco.toLowerCase().includes(termo) ||
          item.imovelCodigo.toLowerCase().includes(termo) ||
          item.responsavel.toLowerCase().includes(termo)
        );

        corpoTabela.innerHTML = "";

        if (filtrado.length === 0) {
          corpoTabela.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">Nenhum registro encontrado.</td></tr>`;
          return;
        }

        filtrado.forEach(item => {
          const linha = document.createElement("tr");
          linha.innerHTML = `
            <td>${item.data}</td>
            <td>${item.imovelEndereco} - Cód: ${item.imovelCodigo}</td>
            <td class="${item.acao === 'Retirada' ? 'text-danger' : 'text-success'} fw-bold">${item.acao}</td>
            <td>${item.responsavel}</td>
          `;
          corpoTabela.appendChild(linha);
        });
      }

      // Filtro ao digitar
      inputFiltro.addEventListener("input", () => {
        carregarHistorico(inputFiltro.value);
      });

      // Impressão
      btnImprimir.addEventListener("click", () => {
        window.print();
      });

      // Carregar dados inicialmente
      carregarHistorico();
    });
  </script>
</body>
</html>
