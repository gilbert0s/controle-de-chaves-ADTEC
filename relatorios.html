<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relatórios - ADTEC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="icon" href="img/logoADTEC.png" type="image/png"> <!-- Verifique o caminho do seu logo -->
</head>
<body class="dashboard-body">

  <header class="dashboard-header">
    <a href="dashboard.html" class="logo-area">
      <img src="img/logoADTEC.png" alt="ADTEC Logo" class="header-logo-symbol"> <!-- Verifique o caminho do seu logo -->
      <span class="header-site-name">ADTEC Chaves</span>
    </a>
    <nav class="dashboard-nav">
      <span>Olá, Gilberto!</span>
      <a href="index.html" class="logout-link">Sair</a>
    </nav>
  </header>

  <main class="container-fluid mt-4">
    <div class="dashboard-container">
      <h1 class="dashboard-title">Histórico de Movimentação</h1>

      <!-- Filtro por Endereço/Código -->
      <div class="row g-3 align-items-center mb-4">
        <div class="col-md-6">
          <label for="input-busca-historico" class="form-label">Filtrar por imóvel (endereço ou código):</label>
          <input type="text" class="form-control" id="input-busca-historico" placeholder="Digite para buscar...">
        </div>
      </div>

      <!-- Tabela de Histórico -->
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th scope="col">Data e Hora</th>
              <th scope="col">Imóvel</th>
              <th scope="col">Ação</th>
              <th scope="col">Responsável</th>
            </tr>
          </thead>
          <tbody id="tabela-historico-corpo">
            <!-- O JavaScript vai preencher esta área -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
