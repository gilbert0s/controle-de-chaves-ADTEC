<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Chaves - Login</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>
    <div class="login-container">
        <div class="logo-circle">
            <img src="img/logoADTEC.png"ADTEC Logo" class="adtec-logo">
        </div>

        <div class="login-box">
            <h2 class="title">CONTROLE DE CHAVES</h2>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" placeholder="usuário" id="usuario">
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="senha" id="senha">
                <i class="fas fa-eye" id="toggle-senha" style="cursor: pointer;"></i>
            </div>
            <button class="btn-login" id="btn-login">Entrar</button>
            <a href="#" class="forgot-password">Esqueceu a senha?</a>
        </div>
    </div>

     <script>
        const toggleSenhaIcon = document.getElementById('toggle-senha');
        const senhaInput = document.getElementById('senha');

        toggleSenhaIcon.addEventListener('click', function() {
            // Verifica se o tipo do input é 'password'
            if (senhaInput.type === 'password') {
                // Se for, muda para 'text' para mostrar a senha
                senhaInput.type = 'text';
                // E troca o ícone para o olho FECHADO (com corte)
                toggleSenhaIcon.classList.remove('fa-eye');
                toggleSenhaIcon.classList.add('fa-eye-slash');
            } else {
                // Se não for, muda de volta para 'password' para ocultar
                senhaInput.type = 'password';
                // E troca o ícone para o olho ABERTO
                toggleSenhaIcon.classList.remove('fa-eye-slash');
                toggleSenhaIcon.classList.add('fa-eye');
            }
        });

        document.getElementById('btn-login').addEventListener('click', function() {
            const usuarioInput = document.getElementById('usuario').value;
            const senhaValor = senhaInput.value; 

            const usuariosValidos = {
                "Ana Jaqueline": "24000520",
                "Gilberto": "24000566",
                "Leonardo": "24000528"
            };

            if (usuariosValidos[usuarioInput] && usuariosValidos[usuarioInput] === senhaValor) {
                localStorage.setItem('usuarioLogado', usuarioInput);
                window.location.href = 'dashboard.html';
            } else {
                alert('Usuário ou senha incorretos!');
            }
        });
    </script>

</body>
</html>
